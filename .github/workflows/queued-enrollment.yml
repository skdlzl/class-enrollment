name: Queued enrollment verification
on:
  push:
    branches: [feat/queued-enrollment]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Queue durability and concurrency integration tests
        working-directory: backend
        run: bash mvnw -B -Dtest=EnrollmentQueueIntegrationTest,EnrollmentServiceTest,EnrollmentRedissonFacadeTest test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
      - name: Browser request lifecycle smoke test (mocked API)
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-test-reports
          path: |
            backend/target/surefire-reports/
            frontend/test-results/
