name: Windows PowerShell compatibility
on:
  push:
    branches: [feat/course-local-admission]
    paths: ['scripts/measure-course-admission.ps1', '.github/workflows/windows-script.yml']
  workflow_dispatch:
jobs:
  powershell-51:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate PowerShell 5.1 encoding, syntax and Java diagnostic command
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $PWD 'scripts/measure-course-admission.ps1'
          $bytes = [IO.File]::ReadAllBytes($path)
          if ($bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) { throw 'UTF-8 BOM missing' }
          $tokens = $null
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          $javaVersion = (& java --version | Out-String)
          if ($LASTEXITCODE -ne 0) { throw 'Java diagnostic failed' }
          if ([string]::IsNullOrWhiteSpace($javaVersion)) { throw 'Java version missing' }
          Write-Host "PowerShell $($PSVersionTable.PSVersion): script syntax, UTF-8 BOM and Java stdout verified"
