name: Course full fast fail tests
on:
  push:
    branches: [feat/course-full-fast-fail]
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit and MySQL capacity query tests
        working-directory: backend
        run: bash mvnw -Dtest=EnrollmentFastFailTest,EnrollmentCourseLockPollingTest,EnrollmentRedissonFacadeTest,EnrollmentServiceTest,EnrollmentLockScopeExperimentTest,CourseCapacityQueryIntegrationTest test
