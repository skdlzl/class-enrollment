name: Windows atomic diagnostic compatibility
on:
  push:
    branches: [test/atomic-update-latency-analysis]
    paths: ['scripts/measure-atomic-update-windows.ps1', 'scripts/atomic-diagnostics/**', '.github/workflows/windows-atomic-script.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-powershell:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Validate PowerShell 5.1 and isolated measurement report
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($path in 'scripts/measure-atomic-update-windows.ps1','scripts/atomic-diagnostics/report.ps1') {
            $bytes=[IO.File]::ReadAllBytes((Join-Path $PWD $path))
            if($bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) { throw "UTF-8 BOM missing: $path" }
            $tokens=$null;$errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $path),[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
          . ./scripts/atomic-diagnostics/report.ps1
          $fixture=Join-Path $env:RUNNER_TEMP 'atomic-fixture'
          New-Item -ItemType Directory -Force $fixture | Out-Null
          $http=@('timeStamp,elapsed,label,responseCode')
          for($i=0;$i -lt 500;$i++) { $code='409';if($i -lt 100){$code='201'};$http+=('1000,100,Enrollment,'+$code) }
          $http | Set-Content (Join-Path $fixture 'http.jtl') -Encoding ascii
          foreach($port in 18080,18081) {
            $dir=Join-Path $fixture "$port";New-Item -ItemType Directory $dir | Out-Null
            # Warmup event outside the HTTP measurement window must be excluded.
            @('epochMs,connectionId,thread,phase,sqlKind,durationMs,ok','999,1,http-exec-1,acquire,,9999,true','1050,2,http-exec-1,acquire,,10.5,true','1060,2,http-exec-1,sql,COURSE_UPDATE,20.25,true') | Set-Content (Join-Path $dir 'jdbc.csv') -Encoding ascii
            @('epochMs,active,idle,pending,total','999,10,0,999,10','1050,10,0,12,10') | Set-Content (Join-Path $dir 'pool.csv') -Encoding ascii
          }
          @("epochMs`twaitingTransactions`twaitEdges","999`t999`t999","1050`t4`t4") | Set-Content (Join-Path $fixture 'mysql-pool-waits.tsv') -Encoding ascii
          '{"capacity":100,"enrolled_count":100,"enrollment_count":100}' | Set-Content (Join-Path $fixture 'final-state.json') -Encoding ascii
          $r=Get-AtomicReport $fixture atomic 10 1 5
          if($r.Http.Count -ne 500 -or $r.Http.P95Ms -ne 100 -or $r.Responses['201'] -ne 100 -or $r.Responses['409'] -ne 400) { throw 'HTTP report failed' }
          if($r.Jdbc['acquire'].Count -ne 2 -or $r.Jdbc['acquire'].AvgMs -ne 10.5 -or $r.Jdbc['COURSE_UPDATE'].AvgMs -ne 20.25) { throw 'JDBC window or decimal parsing failed' }
          if($r.MaxPoolPendingPerJvm -ne 12 -or $r.MaxMySqlWaitingTransactions -ne 4 -or -not $r.Consistent -or -not $r.ObservationComplete) { throw 'Pool/DB report failed' }
          [xml]$jmx=Get-Content scripts/atomic-diagnostics/500.jmx -Raw
          if($jmx.SelectSingleNode("//CSVDataSet/boolProp[@name='quotedData']").InnerText -ne 'false') { throw 'CSV contract changed' }
          Write-Host "PowerShell $($PSVersionTable.PSVersion): parser and report checks passed"
      - name: Compile JDBC observer and Windows flush endpoint
        shell: powershell
        run: |
          Copy-Item analysis/LatencyDiagnostics.java backend/src/main/java/com/jiyun/classenrollment/common/config/LatencyDiagnostics.java
          Copy-Item scripts/atomic-diagnostics/LatencyFlushController.java backend/src/main/java/com/jiyun/classenrollment/common/config/LatencyFlushController.java
          Set-Location backend
          & mvn -B -DskipTests package
          if($LASTEXITCODE -ne 0) { throw 'Diagnostic Java compilation failed' }
      - name: Verify actual Java PID, port identity, termination and JAR release
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $utf8=New-Object System.Text.UTF8Encoding($false)
          $javaHome=(& java scripts/atomic-diagnostics/JavaRuntimeHome.java | Out-String).Trim()
          if($LASTEXITCODE -ne 0) { throw 'Java runtime resolution failed' }
          $actualJava=Join-Path $javaHome 'bin/java.exe'
          if(-not (Test-Path $actualJava)) { throw 'Actual JVM executable is missing' }
          $probeFolder=Join-Path $env:RUNNER_TEMP 'probe evidence'
          $classes=Join-Path $probeFolder 'classes'
          New-Item -ItemType Directory -Force $classes | Out-Null
          & (Join-Path $javaHome 'bin/javac.exe') -d $classes scripts/atomic-diagnostics/WindowsDiagnosticProbe.java
          if($LASTEXITCODE -ne 0) { throw 'HTTP probe compilation failed' }
          $jar=Join-Path $probeFolder 'probe.jar'
          & (Join-Path $javaHome 'bin/jar.exe') --create --file $jar --main-class WindowsDiagnosticProbe -C $classes .
          if($LASTEXITCODE -ne 0) { throw 'HTTP probe JAR creation failed' }
          $tokens=$null;$errors=$null
          $ast=[System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/measure-atomic-update-windows.ps1'),[ref]$tokens,[ref]$errors)
          foreach($name in 'Wait-Ready','Stop-Servers') {
            $definition=$ast.Find({param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq $name},$true)
            Invoke-Expression $definition.Extent.Text
          }
          $out=$probeFolder
          $process=Start-Process -FilePath $actualJava -ArgumentList @('--add-modules','jdk.httpserver','-jar',('"'+$jar+'"'),'18089',('"'+$probeFolder+'"'),'--analysis.enabled=true') -PassThru -RedirectStandardOutput (Join-Path $probeFolder 'stdout.log') -RedirectStandardError (Join-Path $probeFolder 'stderr.log')
          $script:servers=@([pscustomobject]@{Process=$process;ActualProcess=$null;Port=18089;Folder=$probeFolder})
          try {
            Wait-Ready 18089
            if($null -eq $script:servers[0].ActualProcess -or $script:servers[0].ActualProcess.Id -ne $process.Id) { throw 'Wrong Java PID registered' }
            $identity=Get-Content (Join-Path $probeFolder 'identity.json') -Raw | ConvertFrom-Json
            if($identity.folder -ne $probeFolder -or $identity.pid -ne $process.Id) { throw 'Wrong HTTP server identity accepted' }
          } finally { Stop-Servers }
          if(Get-NetTCPConnection -State Listen -LocalPort 18089 -ErrorAction SilentlyContinue) { throw 'Diagnostic JVM still owns port after stop' }
          $exclusive=[IO.File]::Open($jar,[IO.FileMode]::Open,[IO.FileAccess]::Read,[IO.FileShare]::None)
          $exclusive.Close()
          Remove-Item $jar -Force
          Write-Host 'Actual JVM identity, process termination and JAR deletion passed'

