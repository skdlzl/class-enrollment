name: Pessimistic course lock verification
on:
  push:
    branches: [feat/pessimistic-course-lock]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate PowerShell runner syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/run-lock-comparison.ps1", [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; exit 1 }
      - name: Unit and real MySQL/Redis integration tests
        working-directory: backend
        run: bash mvnw -B -Dtest=LocalCourseGateTest,EnrollmentServiceTest,EnrollmentRedissonFacadeTest,EnrollmentLockScopeExperimentTest,EnrollmentPessimisticFacadeTest,EnrollmentPessimisticIntegrationTest test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pessimistic-lock-test-reports
          path: backend/target/surefire-reports/
