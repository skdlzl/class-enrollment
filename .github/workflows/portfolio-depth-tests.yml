name: Portfolio depth experiments

on:
  push:
    branches:
      - feat/portfolio-depth-experiments
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Redisson failure and lock scope tests
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -Dtest=EnrollmentRedissonFacadeTest,EnrollmentLockScopeExperimentTest test
