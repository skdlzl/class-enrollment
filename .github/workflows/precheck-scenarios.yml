name: Closed-course precheck scenario matrix
on:
  push:
    branches: [feat/atomic-capacity-precheck]
    paths: ['experiments/db-split/scripts/measure-precheck-scenarios.py', '.github/workflows/precheck-scenarios.yml']
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario: [hot-5s, delayed-click, burst-100ms]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Safety tests and package
        run: bash backend/mvnw -B -f experiments/db-split/backend/pom.xml -Dtest=ClosedCoursePrecheckTest,AtomicCapacitySafetyTest,EnrollmentFacadeTest,SetNxFacadeTest package
      - name: Start disposable split databases and Redis
        run: |
          python -m pip install aiohttp==3.11.18
          docker compose -p precheck-ci -f experiments/db-split/compose.compare.yml --profile split --profile redis up -d --wait
      - name: Measure three alternating rounds on two app servers
        run: python experiments/db-split/scripts/measure-precheck-scenarios.py ${{ matrix.scenario }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: precheck-${{ matrix.scenario }}
          path: |
            experiments/db-split/results/precheck-${{ matrix.scenario }}
            experiments/db-split/backend/target/surefire-reports
      - name: Stop disposable services
        if: always()
        run: docker compose -p precheck-ci -f experiments/db-split/compose.compare.yml --profile split --profile redis down -v
