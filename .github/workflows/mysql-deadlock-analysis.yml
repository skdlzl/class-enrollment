name: MySQL deadlock analysis
on:
  push:
    branches: [test/mysql-deadlock-analysis]
  pull_request:
    branches: [feat/enrollment-api-no-lock]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: analysis-test-password
          MYSQL_DATABASE: deadlock_analysis
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -panalysis-test-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Reproduce original service and serialized control
        working-directory: backend
        env:
          DB_URL: jdbc:mysql://localhost:3306/deadlock_analysis?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          DB_USERNAME: root
          DB_PASSWORD: analysis-test-password
        run: |
          mvn -B -Dtest=EnrollmentDeadlockAnalysisTest test
      - name: Preserve SQL and InnoDB evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-deadlock-evidence
          path: |
            backend/target/deadlock-evidence/
            backend/target/surefire-reports/
          retention-days: 30
