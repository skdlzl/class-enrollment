name: Enrollment crash and idempotency verification
on:
  push:
    branches: [experiment/db-split]
    paths:
      - 'experiments/db-split/backend/src/test/java/com/jiyun/dbsplit/EnrollmentCrashServer.java'
      - 'experiments/db-split/backend/src/test/java/com/jiyun/dbsplit/EnrollmentProcessCrashTest.java'
      - '.github/workflows/enrollment-crash-verification.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Real process termination and enrollment safety
        run: bash backend/mvnw -B -f experiments/db-split/backend/pom.xml -Dtest=EnrollmentProcessCrashTest -Denrollment.crash=true test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enrollment-crash-verification
          path: |
            experiments/db-split/backend/target/enrollment-crash
            experiments/db-split/backend/target/surefire-reports
