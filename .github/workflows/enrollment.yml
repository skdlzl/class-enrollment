name: Enrollment correctness and load
on:
  push:
    branches: [feat/enrollment-rebuild]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness
          path: backend/target/surefire-reports
  load:
    needs: correctness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml -DskipTests package
      - run: docker compose up -d --wait mysql redis external
      - run: pip install requests pymysql
      - run: python scripts/benchmark.py --requests 12000 --concurrency 128 --rounds 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-raw-data
          path: results
