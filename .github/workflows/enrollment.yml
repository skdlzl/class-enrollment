name: Enrollment correctness and load
on:
  pull_request:
    branches: [main]
    paths: ["backend/**", "scripts/**", "compose.yaml", ".github/workflows/enrollment.yml"]
  workflow_dispatch:
concurrency:
  group: enrollment-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness
          path: backend/target/surefire-reports
  load:
    strategy:
      fail-fast: false
      matrix:
        round: [0, 1, 2]
    needs: correctness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml -DskipTests package
      - run: docker compose up -d --wait mysql redis external
      - run: pip install requests pymysql
      - run: python scripts/benchmark.py --requests 12000 --concurrency 128 --rounds 1 --round-offset ${{ matrix.round }}
      - run: mkdir -p results && docker compose logs --no-color > results/services.log
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-raw-data-${{ matrix.round }}
          path: results
