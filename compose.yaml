services:
  mysql:
    image: mysql:8.4
    container_name: class-enrollment-mysql
    environment:
      MYSQL_DATABASE: class_enrollment
      MYSQL_USER: class_user
      MYSQL_PASSWORD: class_password
      MYSQL_ROOT_PASSWORD: root_password
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - class-enrollment-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: class-enrollment-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  class-enrollment-mysql-data:

