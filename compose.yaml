services:
  mysql:
    image: mysql:8.4
    container_name: class-enrollment-mysql
    environment:
      MYSQL_DATABASE: class_enrollment
      MYSQL_USER: class_user
      MYSQL_PASSWORD: class_password
      MYSQL_ROOT_PASSWORD: root_password
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    volumes:
      - class-enrollment-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 20
  external:
    image: python:3.12-slim
    volumes: ["./scripts/external_api.py:/app/external_api.py:ro"]
    command: ["python", "/app/external_api.py"]
    environment:
      EXTERNAL_DELAY_MS: ${EXTERNAL_DELAY_MS:-20}
      EXTERNAL_STATUS: ${EXTERNAL_STATUS:-204}
    ports: ["8090:8090"]
  api1: &api
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/class_enrollment?serverTimezone=Asia/Seoul
      REDIS_HOST: redis
      EXTERNAL_URL: http://external:8090
      ENROLLMENT_STRATEGY: ${ENROLLMENT_STRATEGY:-REDIS}
    ports: ["8080:8080"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      external: {condition: service_started}
  api2:
    <<: *api
    ports: ["8081:8080"]

volumes:
  class-enrollment-mysql-data:

