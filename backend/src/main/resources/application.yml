spring:
  application:
    name: class-enrollment-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/class_enrollment?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:class_user}
    password: ${DB_PASSWORD:class_password}
    hikari:
      # Per-statement MySQL row-lock wait, not a request deadline.
      connection-init-sql: SET SESSION innodb_lock_wait_timeout=10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

redisson:
  address: ${REDIS_ADDRESS:redis://localhost:6379}

# Same JAR: REDIS is the control group. No local admission gate in either mode.
enrollment:
  course-lock-strategy: ${COURSE_LOCK_STRATEGY:PESSIMISTIC}
